name: Publish

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write
    packages: write

jobs:
    publish:
        name: Publish
        uses: NixySoftware/.github/.github/workflows/publish.yml@54442bffc98f5fcf1c421dbe9353db4647881d94 # v0.6.1
        with:
            enable-rust: false
            enable-typescript: true
            typescript-registry-github: false
            typescript-registry-npm: true
